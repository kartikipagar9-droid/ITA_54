<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Library Management System</h1>
    <p>Welcome to our Library!</p>
    <h2>Add a New Book</h2>
    <form id="bookForm">
        <label for="bookName">Book Name:</label>
        <input type="text" id="bookName" placeholder="Book Name" required>
        <br><br>
        <label for="author">Author:</label>
        <input type="text" id="author" placeholder="Author Name" required>
        <br><br>
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" placeholder="Quantity" min="1" required>
        <br><br> 
        <button type="submit">Add Book</button>
    </form>
    <h2>Book List</h2>
    
<div class="search-container">
    <input
        type="text"
        id="searchInput"
        placeholder="Search by book name or author..."
    >
    <button type="button" id="searchButton">Search</button>
    <button type="button" id="showAllButton">Show All</button>
    <button type="button" id="clearSearchButton">Clear Search</button>
</div>

<p id="bookCount">Total Books: 0</p>

    <table border="1">
        <thead>
            <tr>
                <th>Book Name</th>
                <th>Author</th>
                <th>Quantity</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="bookList"></tbody>
    </table>
    
<div id="editBookForm" style="display: none; margin-top: 20px;">
    <h3>Edit Book</h3>

    <form id="updateBookForm">
        <input type="hidden" id="editBookId">

        <label for="editBookName">Book Name:</label>
        <input type="text" id="editBookName" required>

        <label for="editAuthor">Author:</label>
        <input type="text" id="editAuthor" required>

        <label for="editQuantity">Quantity:</label>
        <input type="number" id="editQuantity" min="1" step="1" required>

        <button type="submit">Save Changes</button>
        <button type="button" id="cancelEdit">Cancel</button>
    </form>
</div>

    <script src="script.js"></script>
</body>
</html>
